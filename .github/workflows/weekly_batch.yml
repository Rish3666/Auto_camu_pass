name: Weekly Camu Gate Pass Batch

on:
  schedule:
    # Runs every Tuesday at 04:30 UTC (10:00 AM IST — inside 09:00–23:00 IST window)
    - cron: '30 4 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (fill form & screenshot without clicking Submit)"
        required: false
        default: false
        type: boolean

jobs:
  submit-gatepasses:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Camu Gate Pass Batch
        env:
          USERS_CONFIG: ${{ secrets.USERS_CONFIG }}
          CAMU_SECRET_KEY: ${{ secrets.CAMU_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python runner.py --dry-run
          else
            python runner.py
          fi

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camu-screenshots-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
