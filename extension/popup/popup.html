<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Camu Pass</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-left">
        <h1>Auto Camu Pass</h1>
        <p class="muted">Weekly gate pass automation</p>
      </div>
      <span class="badge badge-outline">Tue · 09–23</span>
    </header>

    <!-- Camu Session / Profile Sync Card -->
    <section class="card">
      <div class="card-row">
        <div class="profile-info">
          <div class="avatar" id="profile-avatar">?</div>
          <div>
            <div class="profile-name" id="profile-name">Camu not synced</div>
            <div class="profile-meta" id="profile-meta">Open Camu & log in to fetch details</div>
          </div>
        </div>
        <button id="sync-btn" type="button" class="btn btn-outline btn-sm">Open Camu</button>
      </div>
    </section>

    <div id="status-banner" class="status-line">Ready</div>

    <form id="settings-form" class="form">
      <!-- shadcn Switch row -->
      <label class="switch-card" for="enabled">
        <div>
          <div class="switch-title">Auto-submit on Tuesdays</div>
          <div class="switch-desc">Checks every 15m while Chrome is open</div>
        </div>
        <span class="switch">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </span>
      </label>

      <div class="separator"></div>

      <div class="grid-2">
        <div class="field">
          <label for="passType">Pass type</label>
          <input type="text" id="passType" placeholder="Day Outing" value="Day Outing" />
        </div>
        <div class="field">
          <label for="reason">Reason</label>
          <input type="text" id="reason" placeholder="Personal work" value="Personal work" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="outTime">Out time</label>
          <input type="time" id="outTime" value="10:00" />
        </div>
        <div class="field">
          <label for="inTime">In time</label>
          <input type="time" id="inTime" value="20:00" />
        </div>
      </div>

      <details class="details">
        <summary>Auto-login credentials <span class="muted">(optional)</span></summary>
        <div class="details-body">
          <div class="field">
            <label for="username">Camu username / email</label>
            <input type="text" id="username" placeholder="student@college.edu" />
          </div>
          <div class="field">
            <label for="password">Camu password</label>
            <input type="password" id="password" placeholder="Stored locally in Chrome" />
          </div>
        </div>
      </details>

      <button type="submit" class="btn btn-primary btn-full">Save changes</button>
    </form>

    <div class="grid-2 footer-actions">
      <button id="dry-run-btn" type="button" class="btn btn-outline">Dry-run</button>
      <button id="submit-now-btn" type="button" class="btn btn-secondary">Submit now</button>
    </div>

    <details class="details">
      <summary>API Recorder <span class="muted" id="capture-count">(0 captured)</span></summary>
      <div class="details-body">
        <div class="muted">Record once with DevTools closed while using Camu, then copy log.</div>
        <div class="grid-2">
          <button id="capture-toggle-btn" type="button" class="btn btn-outline btn-sm">Start recording</button>
          <button id="copy-log-btn" type="button" class="btn btn-secondary btn-sm">Copy API log</button>
        </div>
        <button id="clear-log-btn" type="button" class="btn btn-outline btn-sm btn-full">Clear log</button>
      </div>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
